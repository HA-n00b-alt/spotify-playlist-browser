# Runs `pnpm run verify` on every pull request (#9, ADR 0005). The `main` ruleset requires the
# `verify` job to pass before a pull request can merge, so keep the job name stable.
name: verify

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Version comes from `packageManager` in package.json (#32).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `npm run`, not `pnpm run`, until #22 is fixed (see scripts/lib/verify/verifySteps.js).
      - run: npm run verify
